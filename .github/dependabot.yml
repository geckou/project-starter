version: 2
updates:
  # yarn workspaces はルートの package.json / yarn.lock で全 workspace をカバーする
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types:
          - minor
          - patch
    ignore:
      # Expo はバージョン整合が厳しく `expo install` 前提のため手動更新とする
      - dependency-name: 'expo'
      - dependency-name: 'expo-*'
      - dependency-name: 'react-native'
      - dependency-name: 'react-native-*'
      - dependency-name: '@expo/*'
      - dependency-name: '@react-native-async-storage/*'
      - dependency-name: 'eslint-config-expo'
      # react / react-dom のメジャーは Expo SDK（mobile は 18 系固定）と
      # 密結合のため SDK アップグレードと合わせて手動更新とする
      - dependency-name: 'react'
        update-types: ['version-update:semver-major']
      - dependency-name: 'react-dom'
        update-types: ['version-update:semver-major']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
