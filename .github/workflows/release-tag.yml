name: Release Tag

# 派生プロジェクトが参照するメジャーバージョンのタグ（v1）を production の先頭へ進める。
#
# 派生側の CI は `uses: geckou/project-starter/.github/workflows/ci.yml@v1` の形で
# このタグを指す。production へマージするたびにタグが進むので、チェック内容の修正は
# 各派生での取り込み作業ゼロで行き渡る（詳細は .claude/docs/git-workflow.md）。
#
# **互換性を壊す変更では v1 を進めない。** コミットメッセージに BREAKING CHANGE
# （または conventional commits の `type!:`）が含まれていたら昇格を止め、
# v2 を切って派生側の参照を更新する、という判断を促す。
#
# 対象を .github/workflows/ に限っているのは、reusable workflow から呼ばれる
# scripts/ は**呼び出し元のリポジトリのもの**が実行されるため（checkout は呼び出し元を
# チェックアウトする）。スクリプトはこのタグでは配られず、Template Sync で届く。

on:
  push:
    branches: [production]
    # このタグで実際に配られるのはワークフローだけ
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  move-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # 破壊的変更の判定にコミットメッセージを読む
          fetch-depth: 1

      # 互換性を壊す変更では v1 を進めない（進めると、参照している派生プロジェクトの
      # CI が予告なく壊れる）。止まったら v2 を切って派生側の参照を更新する
      - name: Check for breaking changes
        id: gate
        run: |
          MESSAGE=$(git log -1 --pretty=%B)

          if printf '%s' "$MESSAGE" | grep -qE 'BREAKING CHANGE|^[a-z]+(\([^)]*\))?!:'; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "::warning::破壊的変更のため v1 を進めません。v2 を切り、派生プロジェクトの参照（uses: ...@v1）を更新してください"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Move v1 to the current commit
        if: steps.gate.outputs.promote == 'true'
        env:
          # 互換性を壊す変更をするときは、ここを増やすのではなく
          # 新しいタグ（v2）を切り、派生側の参照を更新する
          MAJOR_TAG: v1
        run: |
          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push origin -f "refs/tags/$MAJOR_TAG"
          echo "::notice::$MAJOR_TAG を ${GITHUB_SHA:0:7} へ進めました"
