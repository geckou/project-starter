name: Release Tag

# 派生プロジェクトが参照するメジャーバージョンのタグ（v1）を production の先頭へ進める。
#
# 派生側の CI は `uses: geckou/project-starter/.github/workflows/ci.yml@v1` の形で
# このタグを指す。production へマージするたびにタグが進むので、チェック内容の修正は
# 各派生での取り込み作業ゼロで行き渡る（詳細は .claude/docs/git-workflow.md）。
#
# **互換性を壊す変更ではタグを進めない。** push で入ったコミットのいずれかが
# Conventional Commits の破壊的変更の書式（件名の `type!:` か、本文の行頭フッター）
# だったら昇格を止め、次のメジャータグ（v2）を切って派生側の参照を更新する、という判断を促す。
# 語が本文に出てくるだけでは止めない（この仕組みを説明したコミットが自分で自分を
# 止めてしまうため。初回の昇格が実際にこれで空振りした）。
#
# 進めるのは「今あるメジャータグのうち最大のもの」。v2 を手で切れば、以後の昇格は
# v2 に移る（v1 は破壊的変更の手前で止まったまま残る）。
#
# 対象を .github/workflows/ に限っているのは、reusable workflow から呼ばれる
# scripts/ は**呼び出し元のリポジトリのもの**が実行されるため（checkout は呼び出し元を
# チェックアウトする）。スクリプトはこのタグでは配られず、Template Sync で届く。

on:
  push:
    branches: [production]
    # このタグで実際に配られるのはワークフローだけ
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  move-tag:
    runs-on: ubuntu-latest
    # テンプレート本体専用。派生プロジェクトでは何もしない
    # （派生の v1 タグを動かしてしまう）
    if: github.repository == 'geckou/project-starter'
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v7
        with:
          # push で入ったコミット範囲のメッセージと、既存のタグを読む
          fetch-depth: 0

      # 進めるタグは「今あるメジャータグのうち最大のもの」。
      # 破壊的変更のあとに v2 を手で切れば、以後の昇格対象も自動で v2 に移る
      # （v1 を固定していると、次の非破壊の変更で v1 が破壊的コミットまで進んでしまう）
      - name: Resolve major tag
        id: tag
        run: |
          MAJOR_TAG=$(git tag -l 'v[0-9]*' | grep -E '^v[0-9]+$' | sort -V | tail -1)
          MAJOR_TAG=${MAJOR_TAG:-v1}

          echo "name=$MAJOR_TAG" >> "$GITHUB_OUTPUT"
          echo "対象のタグ: $MAJOR_TAG"

      # 互換性を壊す変更ではタグを進めない（進めると、参照している派生プロジェクトの
      # CI が予告なく壊れる）。止まったら次のメジャータグを切って派生側の参照を更新する
      - name: Check for breaking changes
        id: gate
        env:
          BEFORE: ${{ github.event.before }}
          MAJOR_TAG: ${{ steps.tag.outputs.name }}
        run: |
          # 検査範囲の基準は「今のメジャータグ」にする。push の範囲だけを見ると、
          # 破壊的変更で止まった直後に無害なコミットを push したとき、その push には
          # 破壊的コミットが含まれないため昇格が通り、タグが破壊的コミットを
          # 飛び越えてしまう（「v1 は破壊的変更の手前で止まったまま残る」が崩れる）。
          # タグ基準なら未昇格分を毎回まとめて判定でき、workflow_dispatch でも同じ。
          if git rev-parse -q --verify "refs/tags/$MAJOR_TAG" > /dev/null; then
            RANGE="${MAJOR_TAG}..${GITHUB_SHA}"
          elif [ -n "$BEFORE" ] &&
            [ "$BEFORE" != "0000000000000000000000000000000000000000" ] &&
            git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            # タグがまだ無いとき（初回の昇格）は push の範囲で見る
            RANGE="${BEFORE}..${GITHUB_SHA}"
          else
            RANGE="${GITHUB_SHA} -1"
          fi

          echo "検査範囲: $RANGE"

          # Conventional Commits の書式でだけ破壊的変更と判定する。
          #   件名: `type!: ...`（`!` が付いている）
          #   本文: 行頭の破壊的変更フッター
          # 「本文のどこかにその語がある」で判定すると、この仕組み自体を説明した
          # コミットが自分で自分を止めてしまう（初回の昇格が実際にこれで空振りした）
          BREAKING=false

          while IFS= read -r commit; do
            [ -z "$commit" ] && continue

            SUBJECT=$(git log -1 --pretty=%s "$commit")
            BODY=$(git log -1 --pretty=%b "$commit")

            if printf '%s\n' "$SUBJECT" | grep -qE '^[a-zA-Z]+(\([^)]*\))?!:'; then
              BREAKING=true
              echo "破壊的変更（件名の !）: $SUBJECT"
            fi

            if printf '%s\n' "$BODY" | grep -qE '^BREAKING[ -]CHANGE:'; then
              BREAKING=true
              echo "破壊的変更（フッター）: $SUBJECT"
            fi
          done <<< "$(git log --format=%H $RANGE)"

          if [ "$BREAKING" = true ]; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "::warning::破壊的変更のため $MAJOR_TAG を進めません。次のメジャータグを切り、派生プロジェクトの参照（uses: ...@${MAJOR_TAG}）を更新してください"
          else
            echo "promote=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Move the major tag to the current commit
        if: steps.gate.outputs.promote == 'true'
        env:
          MAJOR_TAG: ${{ steps.tag.outputs.name }}
        run: |
          git tag -f "$MAJOR_TAG" "$GITHUB_SHA"
          git push origin -f "refs/tags/$MAJOR_TAG"
          echo "::notice::$MAJOR_TAG を ${GITHUB_SHA:0:7} へ進めました"
