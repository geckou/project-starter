name: Deploy

# develop 環境は自動デプロイしない（複数人の feat/* push が互いに上書きし合うため）。
# develop へは各自 `yarn deploy:develop` で手動デプロイする。
on:
  push:
    branches:
      - production # → production 環境
      - 'release/**' # → staging 環境
      - 'hotfix/**' # → staging 環境

# 同一ブランチへの連続 push でデプロイが競合しないよう直列化する
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  # actions/* の実行ランタイムを Node 24 に固定（旧 Node ランタイム非推奨警告の抑制）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # チェック（常に実行）
  check:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Generate Expo type declarations
        run: yarn workspace @geckou/mobile exec expo customize tsconfig.json

      - name: Type Check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Format Check
        run: yarn format:check

      - name: Test
        run: yarn test

      # Firestore ルールテスト（turbo のタスクグラフ外なので明示的に実行する）
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Firestore Rules Test
        run: yarn test:rules

      - name: Build
        run: yarn build

  # デプロイ（FIREBASE_SERVICE_ACCOUNT が設定されている場合のみ）
  # 注: secrets コンテキストは job レベルの if では参照できないため、
  # job の env に展開して step レベルで判定する
  deploy:
    runs-on: ubuntu-latest
    needs: check
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}

    steps:
      # ブランチからデプロイ先の環境を決定し、シークレットの有無を判定
      - name: Set environment
        id: env
        run: |
          REF="${{ github.ref_name }}"
          if [ "$REF" = "production" ]; then
            echo "name=production" >> $GITHUB_OUTPUT
          elif [[ "$REF" == release/* ]] || [[ "$REF" == hotfix/* ]]; then
            echo "name=staging" >> $GITHUB_OUTPUT
          fi

          if [ -n "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "deploy=true" >> $GITHUB_OUTPUT
          else
            echo "deploy=false" >> $GITHUB_OUTPUT
            echo "FIREBASE_SERVICE_ACCOUNT が未設定のためデプロイをスキップします"
          fi

      - uses: actions/checkout@v7
        if: steps.env.outputs.deploy == 'true'

      - uses: actions/setup-node@v7
        if: steps.env.outputs.deploy == 'true'
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile
        if: steps.env.outputs.deploy == 'true'

      # deploy.sh が yarn type-check を実行するため、ここでも型定義生成が必要
      - name: Generate Expo type declarations
        if: steps.env.outputs.deploy == 'true'
        run: yarn workspace @geckou/mobile exec expo customize tsconfig.json

      # 環境別の .env をシークレットから生成
      # （deploy.sh → use-env.sh が .env.local と apps/web/.env.local に配布する）
      - name: Create .env.${{ steps.env.outputs.name }}
        if: steps.env.outputs.deploy == 'true'
        env:
          # name は小文字（staging 等）だが、secrets コンテキストの参照は
          # 大文字小文字を区別しないため ENV_FILE_STAGING 等に解決される
          ENV_FILE: ${{ secrets[format('ENV_FILE_{0}', steps.env.outputs.name)] }}
        # echo は -n 始まりの値や改行の扱いで内容が変わりうるため printf でそのまま書き出す
        run: printf '%s\n' "$ENV_FILE" > .env.${{ steps.env.outputs.name }}

      # サービスアカウントで認証（FIREBASE_TOKEN は firebase-tools v13+ で非推奨）
      - name: Authenticate to Firebase
        if: steps.env.outputs.deploy == 'true'
        run: |
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> $GITHUB_ENV

      # メジャー更新でのデプロイ破壊を防ぐためバージョンを固定する
      - name: Install Firebase CLI
        if: steps.env.outputs.deploy == 'true'
        run: npm install -g firebase-tools@14

      # ローカルと同じ deploy.sh を使う（workspace 依存の一時削除・
      # hosting ターゲット個別デプロイなどの回避策を共有するため）
      - name: Deploy to Firebase
        if: steps.env.outputs.deploy == 'true'
        run: bash scripts/deploy.sh ${{ steps.env.outputs.name }}
