name: Docs Check

# ドキュメントが実在しないファイルを指していないかを検査する。
#
# ci.yml と分けている理由:
#   - ci.yml はコードの差分が無い PR で重いステップを飛ばすため、ドキュメントだけの
#     差分ではこの検査まで飛んでしまう（ci.yml の「Detect code changes」）
#   - この検査はコード側の移動でも壊れる（ファイルを移すとドキュメントが取り残される）ので、
#     ドキュメント・コードのどちらの変更でも走らせる必要がある
#   - yarn install が不要で数秒で終わるため、全 PR で回してもコストにならない
#
# 層マニフェストの検査（check-layers.mjs）も同じ理由でここに置く。層マーカーは
# apps/README.md / packages/README.md にもあるため、.md だけの差分でも走らせる必要がある

on:
  pull_request:
    branches: [production, 'release/**']

concurrency:
  group: docs-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Check documentation references
        run: bash scripts/check-docs.sh

      # 層マーカーは README（.md）にも入っている。ci.yml は .md を非コード扱いで
      # 重いステップを飛ばし、layer-matrix.yml は **/*.md を paths-ignore にしている
      # ため、マーカーだけを消した PR が緑のまま通っていた（node_modules 不要）
      - name: Check layer manifest
        run: node scripts/check-layers.mjs
