name: Branch Guard

# マージルール（CLAUDE.md / .claude/docs/git-workflow.md）の機械的チェック。
#
# 注意: Free プランのプライベートリポジトリでは Required status checks が使えないため、
# このワークフローは「赤い ✗ による可視化」であり、物理的なマージブロックではない。
# 対応プラン（Pro/Team/Enterprise またはパブリックリポジトリ）では
# .github/rulesets/production.json を取り込んで強制する（git-workflow.md 参照）。

on:
  pull_request:
    branches: [production, 'release/**']

jobs:
  guard:
    runs-on: ubuntu-latest
    # テンプレート本体（geckou/project-starter）はマージルールの適用外（CLAUDE.md 参照）
    if: github.base_ref == 'production' && github.repository != 'geckou/project-starter'

    steps:
      - name: Check head branch
        # ブランチ名には $ や ` 等のメタ文字を含められるため、${{ }} をスクリプトへ
        # 直接展開せず env 経由のクォート付き変数として参照する（シェル注入対策）
        env:
          HEAD_REF: ${{ github.head_ref }}
        run: |
          case "$HEAD_REF" in
            release/*|hotfix/*)
              echo "OK: $HEAD_REF から production への PR は許可されています"
              ;;
            *)
              echo "::error::production への PR は release/* または hotfix/* からのみ許可されます（現在: $HEAD_REF）。詳細は .claude/docs/git-workflow.md を参照してください。"
              exit 1
              ;;
          esac

  # コミットメッセージ規約の最終防衛線。
  # ローカルの husky（commit-msg）は node_modules 未インストールの環境や
  # --no-verify で迂回されうるため、CI 側でも PR のコミット全件を検証する。
  # このジョブはテンプレート本体にも適用する（規約はマージルールと別）。
  commit-messages:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          # commitlint が base..head の範囲を辿れるよう全履歴を取得する
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'

      - name: Commit Message Lint
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          npx --yes \
            --package @commitlint/cli@21 \
            --package @commitlint/config-conventional@21 \
            commitlint --from "$BASE_SHA" --to "$HEAD_SHA" --verbose
