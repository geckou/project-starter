name: Template Sync

# 親テンプレート（geckou/project-starter）の更新を派生プロジェクトに PR として取り込む。
# 派生プロジェクトでのみ動作する（テンプレート本体では skip）。
#
# セットアップ（派生プロジェクト側）:
# 1. 取り込みたくないファイル（プロジェクト固有にカスタマイズしたもの）は .templatesyncignore に追記する
# 2. 差分 PR が作られたら、内容を確認してマージする（コンフリクトは PR 上で解決）
# 3. 書き込み権限のある認証情報を登録する。GitHub App と PAT のどちらでも動く（App を推奨）
#
#    App: Variables に TEMPLATE_SYNC_APP_CLIENT_ID、Secrets に TEMPLATE_SYNC_APP_PRIVATE_KEY
#         （App 側の権限は Contents: Read and write と Pull requests: Read and write）
#    PAT: Secrets に TEMPLATE_SYNC_TOKEN
#
#    App があればそちらを使う。App は Organization が持つので個人アカウントに紐づかず、
#    同期 PR の作成者が bot になる。PAT だと作成者がトークンの持ち主になるため、レビュー承認を
#    必須にしている場合は自分の PR を承認できず毎週詰まる（GitHub の仕様。同梱 ruleset の既定は 0 件）。
#    App のインストールトークンは 1 時間で失効して Secrets に置けないので、実行時に生成する
#
# 親テンプレートは public なので読み取り自体は github.token でもできるが、
# GITHUB_TOKEN が起こしたイベントは新しいワークフローを起動しないという GitHub の仕様があり、
# その場合この workflow が作る PR で ci / branch-guard / docs-check が一切走らない
# （required check が Expected のままマージできない）。PR にワークフローを起こすために
# App のインストールトークンか PAT が要る。

on:
  schedule:
    - cron: '0 3 * * 1' # 毎週月曜 03:00 UTC
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    if: github.repository != 'geckou/project-starter'
    permissions:
      contents: write
      pull-requests: write

    steps:
      # 未設定のまま動かすと、毎週「CI が 1 つも走らない = マージできない PR」を
      # 作り続けることになる。黙って続けるより、ここで落として気付けるようにする。
      # secrets は step の if: から参照できないため、判定結果を outputs に落として後段で使う
      - name: 認証方式を決める
        id: auth
        env:
          APP_CLIENT_ID: ${{ vars.TEMPLATE_SYNC_APP_CLIENT_ID }}
          APP_PRIVATE_KEY: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}
          TEMPLATE_SYNC_TOKEN: ${{ secrets.TEMPLATE_SYNC_TOKEN }}
        run: |
          if [ -n "$APP_CLIENT_ID" ] || [ -n "$APP_PRIVATE_KEY" ]; then
            # 片方だけの登録は設定漏れ。黙って PAT へ落とすと、App に移したつもりの
            # プロジェクトが PAT 名義のまま回り続けて気付けない
            if [ -z "$APP_CLIENT_ID" ] || [ -z "$APP_PRIVATE_KEY" ]; then
              echo "::error::GitHub App の設定が片方だけです。Variables の TEMPLATE_SYNC_APP_CLIENT_ID と Secrets の TEMPLATE_SYNC_APP_PRIVATE_KEY の両方を登録してください"
              exit 1
            fi
            echo 'mode=app' >> "$GITHUB_OUTPUT"
          elif [ -n "$TEMPLATE_SYNC_TOKEN" ]; then
            echo 'mode=pat' >> "$GITHUB_OUTPUT"
          else
            echo "::error::認証情報が未設定です。GITHUB_TOKEN が起こしたイベントはワークフローを起動しないため、このまま PR を作っても ci / branch-guard が走らずマージできません。GitHub App（Variables: TEMPLATE_SYNC_APP_CLIENT_ID / Secrets: TEMPLATE_SYNC_APP_PRIVATE_KEY）か PAT（Secrets: TEMPLATE_SYNC_TOKEN）を登録してください"
            exit 1
          fi

      # インストールトークンを実行時に作る。actions/* は GitHub 公式のため
      # SHA 固定の対象外（renovate/default.json の方針）
      - uses: actions/create-github-app-token@v3
        id: app-token
        if: steps.auth.outputs.mode == 'app'
        with:
          client-id: ${{ vars.TEMPLATE_SYNC_APP_CLIENT_ID }}
          private-key: ${{ secrets.TEMPLATE_SYNC_APP_PRIVATE_KEY }}

      # push と PR 作成を GITHUB_TOKEN 以外のトークンで行う。
      # GITHUB_TOKEN のままだと、作られた PR で CI が 1 つも走らない。
      # App を使わない場合は上のステップが skip され outputs.token が空になるので、PAT へ落ちる
      - uses: actions/checkout@v7
        with:
          token: ${{ steps.app-token.outputs.token || secrets.TEMPLATE_SYNC_TOKEN }}

      # サードパーティ Action は書き込み権限のあるトークン（App のインストールトークン、
      # または PAT）を受け取るため、差し替え可能なタグではなくコミット SHA で固定する。
      # 更新は Renovate が SHA ごと差し替える
      - uses: AndreasAugustin/actions-template-sync@8a0f668b83c32a0f673353086d74f12b8853d4f5 # v2.5.3
        id: sync
        with:
          source_repo_path: geckou/project-starter
          upstream_branch: production
          # トークンの入力は 3 つあり、役割が分かれている（v2 の action.yml）。
          #   source_gh_token  取り込み元（テンプレート）の読み取り。既定 github.token
          #   target_gh_token  取り込み先への push と PR 作成。既定 github.token
          #   github_token     deprecated。source_gh_token と同じ「取り込み元」用で、
          #                    target_gh_token のフォールバック先ではない
          #
          # PR 作成に効くのは target_gh_token だけ。ここを渡さないと PR が
          # GITHUB_TOKEN 名義で作られ、CI が 1 つも走らない。
          #
          # source は取り込み元の読み取りだけで、テンプレートは public なので
          # github.token で足りる（action の既定値と同じ）。App のインストールトークンは
          # owner / repositories を指定しない限り派生リポジトリにしかスコープされないため、
          # 別リポジトリを読む経路には使わない
          source_gh_token: ${{ github.token }}
          target_gh_token: ${{ steps.app-token.outputs.token || secrets.TEMPLATE_SYNC_TOKEN }}
          pr_title: 'chore: テンプレート更新の取り込み'
          pr_labels: template-sync
          pr_commit_msg: 'chore: テンプレート更新の取り込み'

      # テンプレート本体は全部入りなので、同期対象のファイルには派生で外した層の
      # マーカー・CI ステップ・Renovate 設定が含まれる。layers.json は
      # .templatesyncignore で派生側の状態が残るため、そのままだと
      # 「未定義の層のマーカーです」で docs-check が落ち、マージすると
      # 外したはずの層が復活する（#296）。取り込んだ差分から外し直す
      - name: 派生で外した層を取り込んだ差分から外し直す
        if: steps.sync.outputs.pr_branch != ''
        env:
          # gh を使うのは下のフォールバック（テンプレートの layers.json を読む）だけで、
          # 相手は public リポジトリなので github.token で足りる。同期用トークンは前段の
          # action が gh auth setup-git を呼ぶ関係で runner の gh 設定に残っているが、
          # GH_TOKEN の env がそれより優先されるので、このステップは github.token で読む。
          #
          # PR ブランチへの push は checkout が埋め込んだ credential（同期用トークン）で行う。
          # checkout の persist-credentials を切ると push が github.token に落ち、
          # ワークフローを起こさない = CI の付かない PR に戻るので、切らないこと
          GH_TOKEN: ${{ github.token }}
          PR_BRANCH: ${{ steps.sync.outputs.pr_branch }}
          TEMPLATE_GIT_HASH: ${{ steps.sync.outputs.template_git_hash }}
          TEMPLATE_REPO: geckou/project-starter
        run: |
          set -euo pipefail

          git fetch origin "$PR_BRANCH"
          git checkout "$PR_BRANCH"

          if [ ! -f layers.json ]; then
            echo "layers.json が無いためスキップします"
            exit 0
          fi

          # 減算に使うのはテンプレート側（全部入り）のマニフェスト。
          # ワークツリーの layers.json は派生の構成そのもので、外した層の定義を持たない。
          # 同期の pull でテンプレートのオブジェクトはローカルに来ているので git show で取れる。
          # 取れない場合（gc 等）だけ API に落とす
          if ! git show "${TEMPLATE_GIT_HASH}:layers.json" > /tmp/template-layers.json 2>/dev/null; then
            gh api "repos/${TEMPLATE_REPO}/contents/layers.json?ref=${TEMPLATE_GIT_HASH}" \
              --jq '.content' | base64 -d > /tmp/template-layers.json
          fi

          node scripts/sync-layers.mjs --template /tmp/template-layers.json

          if git diff --quiet; then
            echo "外し直す層はありませんでした"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git commit -am 'chore: 派生で外した層を取り込んだ差分から外し直す'
          git push origin "$PR_BRANCH"
