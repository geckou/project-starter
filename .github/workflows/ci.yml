name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production, 'release/**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Type Check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Format Check
        run: yarn format:check

      - name: Test
        run: yarn test

      - name: Build (Web)
        run: yarn build --filter=@geckou/web
