name: CI

# production への push は deploy.yml の check ジョブが同内容を実行するため、
# 二重実行を避けて PR のみをトリガーにする
on:
  pull_request:
    branches: [production, 'release/**']

env:
  # actions/* の実行ランタイムを Node 24 に固定（旧 Node ランタイム非推奨警告の抑制）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Generate Expo type declarations
        run: yarn workspace @geckou/mobile exec expo customize tsconfig.json

      - name: Type Check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Format Check
        run: yarn format:check

      - name: Test
        run: yarn test

      # Firestore ルールテスト（turbo のタスクグラフ外なので明示的に実行する）
      # エミュレーターの実行に Java が必要。メジャー更新での破壊を防ぐため firebase-tools は固定
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools@14

      - name: Firestore Rules Test
        run: yarn test:rules

      - name: Build (Web)
        run: yarn build --filter=@geckou/web
