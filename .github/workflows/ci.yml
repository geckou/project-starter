name: CI

on:
  push:
    branches: [production]
  pull_request:
    branches: [production, 'release/**']

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Generate Expo router types
        run: yarn workspace @geckou/mobile exec expo customize tsconfig.json

      - name: Type Check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Format Check
        run: yarn format:check

      - name: Test
        run: yarn test

      # Firestore ルールテスト（turbo のタスクグラフ外なので明示的に実行する）
      # エミュレーターの実行に Java が必要
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Firestore Rules Test
        run: yarn test:rules

      - name: Build (Web)
        run: yarn build --filter=@geckou/web
