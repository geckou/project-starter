name: CI

# このワークフローは**派生プロジェクトから参照して使える**（reusable workflow）。
# 派生側は同名のファイルに参照 1 行だけを置き、中身はここを見る:
#
#   jobs:
#     ci:
#       uses: geckou/project-starter/.github/workflows/ci.yml@v1
#
# こうするとチェック内容の修正が、各派生での取り込み作業ゼロで行き渡る
# （ファイルのコピーではなくバージョン参照。詳細は .claude/docs/git-workflow.md）。
#
# 層構成（mobile / firebase の有無）は実ファイルを見て実行時に判定するため、
# どの構成の派生から呼ばれても同じファイルで動く。
#
# production への push は deploy.yml の deploy ジョブが同内容のチェックを実行するため、
# 二重実行を避けて PR のみをトリガーにする
on:
  workflow_call:
  pull_request:
    branches: [production, 'release/**']
    # アプリの動作に影響しない変更では回さない（Actions 分の節約）。
    # .claude/ を丸ごと除外しないのは、hooks/ と settings.json が
    # scripts/test-hooks.sh の検証対象だから（paths-ignore は ! による
    # 除外の打ち消しができないため、無視する側を個別に列挙する）
    paths-ignore:
      - '**/*.md'
      - '.claude/docs/**'
      - '.claude/skills/**'
      - '.claude/launch.json'
      - '.vscode/**'
      - '.editorconfig'
      - 'LICENSE'

# 同じ PR に連続 push したとき、古い実行を打ち切る
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # actions/* の実行ランタイムを Node 24 に固定（旧 Node ランタイム非推奨警告の抑制）
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # 層構成に応じて実行するステップを決める。layers.json ではなく実ファイルを見る
      # （層マニフェストを持たない派生プロジェクトでも正しく動くようにするため）
      - name: Detect layers
        id: layers
        run: |
          if [ -d apps/mobile ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "mobile_workspace=$(node -p "require('./apps/mobile/package.json').name")" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

          # ルールファイルの有無ではなくテストの有無で判定する。ルールは持つが
          # ルールテストをまだ持たない構成（Template Sync 未設定の派生プロジェクト）で、
          # 存在しない scripts/test-rules.sh を呼んで落ちるのを防ぐ
          if ls tests/*rules*.test.ts > /dev/null 2>&1; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "rules=false" >> "$GITHUB_OUTPUT"
          fi

      # Claude Code のフック（.claude/hooks/）の回帰テスト。
      # node_modules に依存しないので依存インストールより先に回す。
      # 呼び出し元がスクリプトを外している場合に落とさないよう hashFiles で存在を見る
      # （reusable workflow は構成の違う複数のリポジトリから呼ばれる）
      - name: Hook Test
        if: hashFiles('scripts/test-hooks.sh') != ''
        run: bash scripts/test-hooks.sh

      # 層マニフェスト（layers.json）と実態の一致、および減算スクリプトの回帰テスト。
      # これも node_modules に依存しない
      - name: Layer Manifest Check
        if: hashFiles('scripts/check-layers.mjs') != ''
        run: node scripts/check-layers.mjs

      - name: Layer Test
        if: hashFiles('scripts/test-layers.sh') != ''
        run: bash scripts/test-layers.sh

      # 派生プロジェクトを参照方式へ移行するスクリプトの回帰テスト。
      # これも node_modules に依存しない
      - name: Adopt References Test
        if: hashFiles('scripts/test-adopt-references.sh') != ''
        run: bash scripts/test-adopt-references.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      # リリース時の API 差分検査の回帰テスト。npm レジストリには接続しない
      # （公開物は --published-tarball で差し替える）。
      # node と npm pack を使うので、setup-node の後に置く（.nvmrc のバージョンで走らせる）
      - name: API Diff Guard Test
        if: hashFiles('scripts/test-api-diff.sh') != ''
        run: bash scripts/test-api-diff.sh

      - run: yarn install --frozen-lockfile

      # turbo のローカルキャッシュを実行間で持ち越し、変更のないパッケージの
      # 再ビルドを避ける。build の inputs に .env* が含まれているため、
      # 環境ごとの差はキャッシュキー側で分かれる（turbo.json 参照）
      - name: Restore Turborepo cache
        uses: actions/cache@v6
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-

      - name: Generate Expo type declarations
        if: steps.layers.outputs.mobile == 'true'
        run: |
          yarn workspace "${{ steps.layers.outputs.mobile_workspace }}" \
            exec expo customize tsconfig.json

      - name: Type Check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      # yarn format:check ではなくスクリプトを直接呼ぶ。
      # ルート package.json は Template Sync の対象外なので、yarn 経由だと
      # 派生プロジェクトでは古いコマンド（ビルド前の prettier）のまま実行されてしまう
      # スクリプトは呼び出し元のリポジトリのものが実行されるため、まだ届いていない
      # 構成では存在しない。その場合は yarn 経由にフォールバックする
      - name: Format Check
        run: |
          if [ -f scripts/format.sh ]; then
            bash scripts/format.sh --check
          else
            echo "::notice::scripts/format.sh が無いため yarn format:check を使います"
            yarn format:check
          fi

      - name: Test
        run: yarn test

      # Firestore ルールテスト（turbo のタスクグラフ外なので明示的に実行する）
      # エミュレーターの実行に Java が必要。メジャー更新での破壊を防ぐため firebase-tools は固定
      - uses: actions/setup-java@v6
        if: steps.layers.outputs.rules == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        if: steps.layers.outputs.rules == 'true'
        run: npm install -g firebase-tools@14

      # yarn test:rules ではなくスクリプトを直接呼ぶ。
      # ルート package.json は Template Sync の対象外なので、yarn 経由だと
      # 派生プロジェクトでは古いコマンド（firestore のみ）のまま実行されてしまう
      - name: Firestore / Storage Rules Test
        if: steps.layers.outputs.rules == 'true'
        run: |
          if [ -f scripts/test-rules.sh ]; then
            bash scripts/test-rules.sh
          else
            echo "::notice::scripts/test-rules.sh が無いため yarn test:rules を使います"
            yarn test:rules
          fi

      # ワークスペース名を書かない（派生プロジェクトはスコープをリネームしているため）。
      # mobile には build タスクが無いので、実質 web + shared + functions が対象になる
      - name: Build
        run: yarn build
