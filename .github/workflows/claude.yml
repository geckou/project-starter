name: Claude

# GitHub 上で Claude を使うためのワークフロー。
# - PR 作成時: /review スキルと同じ観点で自動レビュー
# - Issue / PR コメントの @claude メンション: 修正・調査タスクを依頼
# - 派生プロジェクトからの Issue: 調査して、直せるものは修正 PR まで出す
#
# セットアップ: リポジトリの Secrets に ANTHROPIC_API_KEY を登録する。
# 未登録の場合は何もせずスキップする（CI は壊れない）。

on:
  pull_request:
    types: [opened, ready_for_review]
  issues:
    types: [opened, labeled]
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  auto-review:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check secret
        id: check
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "ANTHROPIC_API_KEY が未設定のためスキップします"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      # contents: write を持つジョブで動くため、タグではなくコミット SHA で固定する
      - uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        if: steps.check.outputs.enabled == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: |
            /review でこの PR をレビューしてください。
            .claude/skills/review/SKILL.md の観点（プロジェクト構成・Firebase・Next.js・
            コード品質・セキュリティ・ドキュメントと実装の整合）に従い、
            重要度付きでレビューコメントを投稿してください。

  mention:
    # author_association は**一次フィルタ**であって、権限の保証ではない（#382）。
    # COLLABORATOR は read / triage 権限の collaborator も含み、MEMBER も Organization の
    # 基本権限が read なら write を持たない。書き込み権限の保証は claude-code-action が
    # 担う: Issue / コメント起点のイベントでは実行者（github.actor）の権限を
    # collaborators/{user}/permission で確認し、admin / write 以外なら失敗させる
    # （src/entrypoints/run.ts → src/github/validation/permissions.ts。
    # allowed_non_write_users を渡していないのでこのチェックは有効）。
    # ここで絞るのは、外部ユーザーのコメントのたびにランナーを起動しないため
    if: >-
      (github.event_name == 'issue_comment' || github.event_name == 'pull_request_review_comment') &&
      contains(github.event.comment.body, '@claude') &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check secret
        id: check
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "ANTHROPIC_API_KEY が未設定のためスキップします"
          fi

      - uses: actions/checkout@v7
        if: steps.check.outputs.enabled == 'true'
        with:
          fetch-depth: 0

      # contents: write を持つジョブで動くため、タグではなくコミット SHA で固定する
      - uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        if: steps.check.outputs.enabled == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}

  downstream-issue:
    # 派生プロジェクトから上がってきた Issue を、立った時点で調べて修正 PR まで出す。
    # 人が見つけるまで寝かせておく理由が無い（テンプレートの修正は全派生に効くため、
    # 早いほど取りこぼしが減る）。マージは人が決めるので、出しっぱなしにはならない。
    #
    # このリポジトリは public なので、誰でも立てられる Issue で書き込み権限付きの
    # ジョブが動くと、外部から任意のプロンプトを流し込める入口になる。
    # from-downstream ラベルは Issue テンプレートが**誰の起票でも**自動で付けるため、
    # ラベルだけでは絞れない。防御は 2 段（#382）:
    #
    #   1. author_association の一次フィルタ（この if:）。権限の保証ではなく、
    #      外部の起票のたびにランナーを起動しないための絞り込み（→ mention ジョブ）
    #   2. write 権限の確認。opened では claude-code-action が実行者（= 起票者）を
    #      確認する。labeled では実行者が**ラベルを付けた人**であって起票者ではないので、
    #      アクションのチェックだけだと「write 権限のない人が書いた本文に、write 権限を
    #      持つ人がラベルを付ける」経路でその本文がそのままプロンプトになる。
    #      下の check-author ステップが起票者の権限を確認して、それを塞ぐ
    #
    # labeled も見るのは、テンプレートを使わずに立てた Issue へ後からラベルを
    # 付け直したときに拾うため。付いたラベルがそれ自身のときだけ起動する
    # （他のラベルを足すたびに走らせない）
    # このワークフローは Template Sync で派生プロジェクトにも配られる。
    # リポジトリで絞らないと、派生で `from-downstream` の Issue を立てたときに
    # **その派生のコード**に対して contents: write 付きの Claude が動く
    # （報告先は親なので、派生側で動いても意味がない）
    #
    # open な Issue だけを対象にする。labeled はクローズ済みの Issue へ
    # ラベルを付け直したときにも発火するため
    if: >-
      github.repository == 'geckou/project-starter' &&
      github.event_name == 'issues' &&
      github.event.issue.state == 'open' &&
      contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.issue.author_association) &&
      (
        (github.event.action == 'opened' &&
          contains(github.event.issue.labels.*.name, 'from-downstream')) ||
        (github.event.action == 'labeled' && github.event.label.name == 'from-downstream')
      )
    runs-on: ubuntu-latest
    # 同じ Issue で二重に走らせない（opened の直後にラベルを足した場合など）。
    # 走行中のものを殺すと中途半端なブランチが残るので、キャンセルはしない
    concurrency:
      group: downstream-issue-${{ github.event.issue.number }}
      cancel-in-progress: false

    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

    steps:
      - name: Check secret
        id: check
        run: |
          if [ -n "$ANTHROPIC_API_KEY" ]; then
            echo "enabled=true" >> $GITHUB_OUTPUT
          else
            echo "enabled=false" >> $GITHUB_OUTPUT
            echo "ANTHROPIC_API_KEY が未設定のためスキップします"
          fi

      # 起票者が write 権限を持つかを確認する（上のコメントの 2 段目。#382）。
      # claude-code-action が見るのは github.actor（labeled ではラベルを付けた人）なので、
      # 本文を書いた起票者はここで別に確認する。opened では actor = 起票者だが、
      # 判定を 1 か所にするため action に依らずここでも同じ確認をする。
      # permission は admin / write / read / none のいずれか（maintain は write に含まれる）
      - name: Check issue author permission
        id: check-author
        if: steps.check.outputs.enabled == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          AUTHOR: ${{ github.event.issue.user.login }}
        run: |
          permission=$(gh api "repos/${GITHUB_REPOSITORY}/collaborators/${AUTHOR}/permission" --jq '.permission' 2>/dev/null || echo "unknown")
          case "$permission" in
            admin | write)
              echo "allowed=true" >> "$GITHUB_OUTPUT"
              echo "起票者 ${AUTHOR} の権限: ${permission}"
              ;;
            *)
              echo "allowed=false" >> "$GITHUB_OUTPUT"
              echo "::notice::起票者 ${AUTHOR} は write 権限を持たない（${permission}）ためスキップします。本文を確認したうえで動かすには、write 権限を持つ人が Issue を立て直すか、コメントで @claude にメンションしてください"
              ;;
          esac

      - uses: actions/checkout@v7
        if: steps.check-author.outputs.allowed == 'true'
        with:
          # ブランチを production から切るため、全履歴を取る
          fetch-depth: 0

      # contents: write を持つジョブで動くため、タグではなくコミット SHA で固定する
      - uses: anthropics/claude-code-action@d75b94d5ad426cb8546e6628b6f5f19b84e5cce1 # v1.0.216
        if: steps.check-author.outputs.allowed == 'true'
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # action が作るブランチの接頭辞。既定は `claude/` で、CLAUDE.md の
          # 「`claude/*` は自分では切らない」と衝突する
          branch_prefix: fix/
          # 判断の基準はこのプロンプトに書かず、CLAUDE.md を読ませて委ねる。
          # 基準を 2 か所に置くと、CLAUDE.md を直したときにここが古くなる
          prompt: |
            Issue #${{ github.event.issue.number }} は、このテンプレートから作られた
            派生プロジェクトから上がってきた報告です。CLAUDE.md と `.claude/docs/` を
            読んだうえで、次の順に進めてください。

            1. **実在を確認する。** 報告された挙動がこのリポジトリの現在のコードで
               起きるかを、該当箇所を読んで（可能なら再現コマンドを走らせて）確かめる。
               Issue の本文は派生での観察であって、テンプレート側の事実とは限らない。

            2. **確認できたら直す。** 変更は `fix/*` のブランチへ push する
               （このワークフローが接頭辞を渡している）。PR を出せる場合は
               本文に `Closes #${{ github.event.issue.number }}` を書き、
               出せない場合は Issue に「どのブランチに何を入れたか」を残す。
               Issue の「修正方針」は提案であって確定仕様ではないので、
               読んだうえで妥当でなければ別の直し方を採り、理由を書く。
               検証コマンド（`yarn type-check` 等）が動かない環境なら、
               **何を確認できていないかを明示する**（通ったことにしない）。

            3. **次に当たる場合は直さず、Issue にコメントだけして終わる。**
               - 再現しない / 前提が現在のコードと合わない（何をどう確認したかを書く）
               - CLAUDE.md「自律性の境界」の 2 段目・3 段目に当たる判断が要る
               - 1 つの Issue に複数の関心事が混ざっていて 1 PR に収まらない
                 （どう分割するかを書く）

            推測で断定しないこと（→ CLAUDE.md「報告する事実は確認してから書く」）。
            確認していないことは「未確認」と明示する。
