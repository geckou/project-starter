name: Smoke Test

# テンプレートの経年劣化を検知する定期スモークテスト。
# push がない期間も上流エコシステム（Next.js / Expo / firebase-tools 等）の変化で
# 壊れることがあるため、週次でクリーンな状態から一通り検証する。
# 失敗時は Issue を自動起票する（同名の open Issue があればコメント追記）。

on:
  schedule:
    - cron: '0 0 * * 1' # 毎週月曜 00:00 UTC
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - uses: actions/checkout@v7

      # 層構成に応じて実行するステップを決める（ci.yml と同じ理由で実ファイルを見る）
      - name: Detect layers
        id: layers
        run: |
          if [ -d apps/mobile ]; then
            echo "mobile=true" >> "$GITHUB_OUTPUT"
            echo "mobile_workspace=$(node -p "require('./apps/mobile/package.json').name")" >> "$GITHUB_OUTPUT"
          else
            echo "mobile=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -f firestore.rules ] || [ -f storage.rules ]; then
            echo "rules=true" >> "$GITHUB_OUTPUT"
          else
            echo "rules=false" >> "$GITHUB_OUTPUT"
          fi

      # node_modules に依存しないので依存インストールより先に回す
      - name: Layer Manifest Check
        run: node scripts/check-layers.mjs

      - name: Layer Test
        run: bash scripts/test-layers.sh

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      - run: yarn install --frozen-lockfile

      - name: Generate Expo router types
        if: steps.layers.outputs.mobile == 'true'
        run: |
          yarn workspace "${{ steps.layers.outputs.mobile_workspace }}" \
            exec expo customize tsconfig.json

      - name: Type Check
        run: yarn type-check

      - name: Lint
        run: yarn lint

      - name: Test
        run: yarn test

      - uses: actions/setup-java@v6
        if: steps.layers.outputs.rules == 'true'
        with:
          distribution: temurin
          java-version: 21

      - name: Install Firebase CLI
        if: steps.layers.outputs.rules == 'true'
        run: npm install -g firebase-tools@14

      - name: Firestore Rules Test
        if: steps.layers.outputs.rules == 'true'
        run: bash scripts/test-rules.sh

      - name: Build
        run: yarn build

      - name: Report failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = '[Smoke Test] 週次スモークテストが失敗しました'
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            const body = `週次スモークテストが失敗しました。上流エコシステムの変化でテンプレートが壊れている可能性があります。\n\n実行ログ: ${runUrl}`

            // smoke-test ラベルが未作成だと list/create が 422 になるため先に保証する
            try {
              await github.rest.issues.createLabel({
                ...context.repo,
                name: 'smoke-test',
                color: 'd93f0b',
                description: '週次スモークテストの自動起票',
              })
            } catch (error) {
              if (error.status !== 422) throw error // 422 = 既に存在する
            }

            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: 'smoke-test',
            })

            const existing = issues.find((issue) => issue.title === title)
            if (existing) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: existing.number,
                body,
              })
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
                labels: ['bug', 'smoke-test'],
              })
            }
