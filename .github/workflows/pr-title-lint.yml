name: PR Title Lint

# squash merge のコミットメッセージは PR タイトルから作られるが、commitlint
# （.husky/commit-msg）が見るのは**ローカルのコミット**だけなので、規約外のタイトルが
# そのまま production の履歴に載る。マージボタンは GitHub のサーバー側で動くため、
# pre-git-guard.sh（PreToolUse フック）も原理的に発火しない。
#
# 可読性だけの問題ではない。`release-tag.yml` の破壊的変更ゲートは、この squash
# コミットの件名（`type!:`）と本文のフッターを読んで v1 を進めるかどうかを決める。
# タイトルが規約から外れると、互換性の判断そのものが効かなくなる。
#
# **必須チェックにはしない。** 規約違反は警告のみでコミットをブロックしない
# （CLAUDE.md「コミットメッセージ規約」）という方針に揃える。赤で気付ければ十分で、
# マージするかどうかは人が決める。
#
# 派生プロジェクトからは reusable workflow として参照できる:
#
#   jobs:
#     pr-title:
#       uses: geckou/project-starter/.github/workflows/pr-title-lint.yml@v1

on:
  workflow_call:
  pull_request:
    types: [opened, edited, reopened, synchronize]
    branches: [production, 'release/**']

concurrency:
  group: pr-title-lint-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  pr-title:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: '.nvmrc'
          cache: 'yarn'

      # type の一覧は commitlint.config.cjs が持っている。ここで正規表現を書き直すと
      # 同じ規約の4つ目の写しになるため、実際の設定をそのまま使う
      - run: yarn install --frozen-lockfile

      - name: Lint PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          if [ ! -f commitlint.config.cjs ]; then
            echo "::notice::commitlint.config.cjs が無いため検査をスキップします"
            exit 0
          fi

          echo "PR タイトル: $PR_TITLE"

          if printf '%s\n' "$PR_TITLE" | npx commitlint --config commitlint.config.cjs; then
            exit 0
          fi

          echo "::error::PR タイトルがコミットメッセージ規約に沿っていません。squash merge ではこのタイトルがそのまま production のコミットメッセージになります（例: 'feat: ユーザープロフィール画面を追加'）。詳細は CLAUDE.md「コミットメッセージ規約」"
          exit 1
